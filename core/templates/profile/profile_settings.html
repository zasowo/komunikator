<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Profile Settings</h2>
            <a href="/home/" class="btn btn-secondary">← Back to Home</a>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>

        <hr class="my-4" />
        <h4 class="mb-3">API Access</h4>
        <div class="mb-3">
            <label class="form-label">Current API Key</label>
            <input type="text" class="form-control" value="{{ api_key|default:'Not generated yet' }}" readonly>
            <div class="form-text">Keep this key secret. You can regenerate it at any time.</div>
        </div>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="generate_api_key" value="1" />
            <button type="submit" class="btn btn-outline-secondary">Generate API Key</button>
        </form>
    </div>
</div>
</body>
</html>
